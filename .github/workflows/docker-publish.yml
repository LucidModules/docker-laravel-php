name: Build and Publish Docker Image

on:
  schedule:
    # Weekly rebuild: picks up new FrankenPHP/PHP releases and base image security fixes.
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      frankenphp_version:
        description: 'Exact FrankenPHP release to build on, e.g. 1.13.2 (empty = the highest available)'
        required: false
        default: ''
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

# Least privilege: jobs get a read-only token unless they ask for more.
permissions:
  contents: read

env:
  IMAGE: docker.io/lucidmodules/docker-laravel-php

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Discover latest FrankenPHP versions
        id: discover
        env:
          FRANKENPHP_VERSION: ${{ inputs.frankenphp_version }}
        run: python3 .github/scripts/discover.py

  build:
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          pull: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            FRANKENPHP_VERSION=${{ matrix.frankenphp_version }}
            PHP_VERSION=${{ matrix.php_version }}
          tags: ${{ matrix.tags }}
